
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reality Mark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Global error handler to catch boot-up issues
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        const root = document.getElementById('root');
        if (root && root.innerHTML === '') {
          root.innerHTML = `
            <div style="padding: 24px; color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; font-family: sans-serif; margin: 20px;">
              <h2 style="margin-top: 0; font-size: 18px;">Application Initialization Error</h2>
              <p style="font-size: 14px;">${msg}</p>
              <button onclick="window.location.reload()" style="margin-top: 12px; padding: 8px 16px; background: #991b1b; color: white; border: none; border-radius: 6px; cursor: pointer;">Retry Load</button>
            </div>
          `;
        }
        return false;
      };
      // Polyfill for environment variables
      window.process = { env: { API_KEY: "" } };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #f8fafc;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }
    </style>
