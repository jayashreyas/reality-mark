
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reality Mark | Real Estate OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // CRITICAL: Prevent silent crashes by showing errors immediately
      window.onerror = function(msg, url, line, col, error) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="font-family:ui-sans-serif,system-ui;padding:40px;max-width:600px;margin:40px auto;background:#fff1f2;border:2px solid #fda4af;border-radius:16px;box-shadow:0 20px 25px -5px rgb(0 0 0 / 0.1);">
              <h1 style="color:#9f1239;font-size:24px;font-weight:900;margin-bottom:16px;">System Boot Failure</h1>
              <p style="color:#be123c;font-weight:600;margin-bottom:8px;">Reason: ${msg}</p>
              <p style="color:#e11d48;font-size:12px;margin-bottom:20px;">Location: ${url}:${line}</p>
              <pre style="background:#fff;padding:16px;border-radius:8px;font-size:11px;color:#4b5563;overflow:auto;max-height:200px;border:1px solid #f1f5f9;">${error?.stack || 'No stack trace available'}</pre>
              <button onclick="window.location.reload()" style="margin-top:24px;width:100%;padding:12px;background:#e11d48;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer;">Force System Restart</button>
            </div>
          `;
        }
        return false;
      };

      // Polyfill for Node-like environment variables used by some SDKs
      window.process = { 
        env: { 
          API_KEY: "" // Injected at runtime
        } 
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        background-color: #0f172a;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #0f172a;
      }
      #root:empty::after {
        content: "";
        width: 48px;
        height: 48px;
        border: 4px solid #6366f1;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0?external=react,react-dom",
    "@google/genai": "https://esm.sh/@google/genai@1.31.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
    <script src="https://maps.googleapis.com/maps/api/js?libraries=places"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
